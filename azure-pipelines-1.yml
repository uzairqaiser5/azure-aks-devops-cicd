# Deploy to Azure Kubernetes Service
# Build and push image to Azure Container Registry; Deploy to Azure Kubernetes Service
# Includes Automated Prometheus & Grafana Monitoring Stack with Public LoadBalancer IP

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '002fd4b1-6d8c-44c7-8b74-e655f4eb73fe'
  imageRepository: 'githubweb1'
  containerRegistry: 'registry7967.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'
  imagePullSecret: 'registry79672f31-auth'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)

    - upload: manifests
      artifact: manifests

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build

  jobs:
  - deployment: Deploy
    displayName: Deploy
    pool:
      vmImage: $(vmImageName)
    environment: 'uzairqaiser5staticapp1.default'
    strategy:
      runOnce:
        deploy:
          steps:
          # --- Step 1: Deploy App Credentials & Manifests ---
          - task: KubernetesManifest@0
            displayName: Create imagePullSecret
            inputs:
              action: createSecret
              secretName: $(imagePullSecret)
              dockerRegistryEndpoint: $(dockerRegistryServiceConnection)

          - task: KubernetesManifest@0
            displayName: Deploy to Kubernetes cluster
            inputs:
              action: deploy
              manifests: |
                $(Pipeline.Workspace)/manifests/deployment.yml
                $(Pipeline.Workspace)/manifests/service.yml
              imagePullSecrets: |
                $(imagePullSecret)
              containers: |
                $(containerRegistry)/$(imageRepository):$(tag)

          # --- Step 2: Install Helm Tool on Build Agent ---
          - task: HelmInstaller@1
            displayName: 'Install Helm'
            inputs:
              helmVersionToInstall: 'latest'

          # --- Step 3: Deploy/Upgrade Prometheus & Grafana Stack ---
          - script: |
              # Add official Prometheus community repository
              helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
              helm repo update

              # Deploy or update the monitoring stack
              # Configures Grafana as a LoadBalancer to provision an Azure Public IP
              helm upgrade --install monitoring-stack prometheus-community/kube-prometheus-stack \
                --namespace monitoring \
                --create-namespace \
                --set grafana.service.type=LoadBalancer \
                --set grafana.adminPassword="Admin@123"
            displayName: 'Deploy Prometheus and Grafana via Helm'